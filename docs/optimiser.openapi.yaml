                  - start: '23:00:00'
                    mode: SELF_CONSUMPTION
                  - start: '23:30:00'
                    mode: SELF_CONSUMPTION
        '404':
          description: The customer doesn't exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Customer 00000000-0000-0000-0000-000000000001 not found
        '422':
          description: The customer has no battery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Customer 00000000-0000-0000-0000-000000000001 has no battery
components:
  schemas:
    OptimisedSchedule:
      type: object
      description: A customer's battery schedule for a single day.
      required:
        - for
        - schedule
      properties:
        for:
          type: string
          format: date
          description: The local date the schedule applies to, as an ISO 8601 date.
          example: '2026-11-27'
        schedule:
          type: array
          description: |
            Exactly 48 half-hour slots, from `00:00:00` to `23:30:00` in order,
            including on days when the clocks change.
          minItems: 48
          maxItems: 48
          items:
            $ref: '#/components/schemas/ScheduleSlot'
    ScheduleSlot:
      type: object
      description: The mode the battery should be in for one half-hour slot.
      required:
        - start
        - mode
      properties:
        start:
          type: string
          description: The local time the slot starts, as `HH:MM:SS`.
          pattern: '^([01][0-9]|2[0-3]):(00|30):00$'
          example: '00:30:00'
        mode:
          $ref: '#/components/schemas/BatteryMode'
    BatteryMode:
      type: string
      description: |
        The mode the battery should be in.

        - `FORCE_CHARGE`: charge the battery.
        - `FORCE_DISCHARGE`: discharge the battery.
        - `SELF_CONSUMPTION`: use the battery to meet the home's own demand.
      enum:
        - FORCE_CHARGE
        - FORCE_DISCHARGE
        - SELF_CONSUMPTION
      example: FORCE_CHARGE
    Error:
      type: object
      description: An error response.
      required:
        - message
      properties:
        message:
          type: string
          description: A human-readable description of the error.
          example: Customer 00000000-0000-0000-0000-000000000001 not found
